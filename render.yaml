services:
  - type: web
    name: retail-demand-lab
    env: python
    plan: free
    branch: BigData
    rootDir: Review3
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SERVING_BACKEND
        value: sqlite
      - key: PYTHON_VERSION
        value: 3.11.9
