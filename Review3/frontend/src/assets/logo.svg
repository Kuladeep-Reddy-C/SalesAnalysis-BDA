<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Tile -->
  <rect width="48" height="48" rx="12" fill="url(#bgGrad)" />
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Data Grid Pulse Lines -->
  <line x1="10" y1="36" x2="38" y2="36" stroke="#134e4a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="28" x2="38" y2="28" stroke="#134e4a" stroke-width="1" stroke-dasharray="2 2" stroke-opacity="0.6"/>
  <line x1="10" y1="20" x2="38" y2="20" stroke="#134e4a" stroke-width="1" stroke-dasharray="2 2" stroke-opacity="0.6"/>

  <!-- Analytics Columns -->
  <rect x="12" y="27" width="4" height="9" rx="1.5" fill="#14b8a6" fill-opacity="0.5" />
  <rect x="18" y="21" width="4" height="15" rx="1.5" fill="#14b8a6" fill-opacity="0.7" />
  <rect x="24" y="16" width="4" height="20" rx="1.5" fill="#2dd4bf" />
  <rect x="30" y="23" width="4" height="13" rx="1.5" fill="#14b8a6" fill-opacity="0.6" />

  <!-- Predictive Trend Curve & Nodes -->
  <path d="M11 25 L18 19 L25 13 L31 18 L37 11" 
        stroke="url(#lineGrad)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
        
  <circle cx="25" cy="13" r="2.5" fill="#ffffff" stroke="#0d9488" stroke-width="1.5" />
  <circle cx="37" cy="11" r="2" fill="#5eead4" />
</svg>
